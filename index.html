<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Enhancer Pro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px;}
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .status { margin-top: 15px; text-align: center; font-weight: bold; color: #e67e22; }
        video { max-width: 100%; margin-top: 20px; border-radius: 4px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Video & Audio Enhancer</h1>
        <form id="uploadForm">
            <div class="form-group">
                <label for="videoFile">Pilih Video dari Memori:</label>
                <input type="file" id="videoFile" name="video" accept="video/*" required>
            </div>

            <div class="form-group">
                <label for="fps">Target FPS (Frame Rate):</label>
                <select id="fps" name="fps">
                    <option value="60">60 FPS (Smooth)</option>
                    <option value="120">120 FPS (Ultra Smooth - Proses Lama)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="res">Resolusi (HD):</label>
                <select id="res" name="res">
                    <option value="1280x720">HD 720p (Lebih Cepat)</option>
                    <option value="1920x1080">Full HD 1080p</option>
                </select>
            </div>

            <button type="submit" id="processBtn">Proses Video Sekarang</button>
        </form>
        
        <div id="statusText" class="status"></div>
        <video id="resultVideo" controls></video>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const btn = document.getElementById('processBtn');
            const status = document.getElementById('statusText');
            const videoEl = document.getElementById('resultVideo');

            btn.disabled = true;
            btn.innerText = "Memproses... Mohon Tunggu (Bisa makan waktu beberapa menit)";
            status.innerText = "Sedang merender FPS, menaikkan resolusi, dan membersihkan suara...";

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Gagal memproses video');
                }

                const blob = await response.blob();
                const videoURL = URL.createObjectURL(blob);
                
                videoEl.src = videoURL;
                videoEl.style.display = "block";
                status.innerText = "Selesai! Anda bisa mengunduh atau memutar video di bawah ini.";
                btn.innerText = "Proses Video Lain";
            } catch (error) {
                status.innerText = "Error: " + error.message;
                btn.innerText = "Coba Lagi";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎚️ Editor Audio - Potong & Sambung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #0b1024; color: #e4e4e7; font-family: system-ui, sans-serif; }
    .glass { background: rgba(19,24,56,.6); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.08); }
    .upload-zone { border: 1.5px dashed rgba(255,255,255,.2); transition: all .3s; cursor: pointer; background: rgba(255,255,255,.02); padding: 20px; border-radius: 12px; text-align: center; }
    .upload-zone:hover { border-color: rgba(124,92,255,.5); background: rgba(124,92,255,.05); }
    .btn-primary { background: linear-gradient(135deg, #7c5cff, #21d4fd); color: #fff; font-weight: 600; padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; transition: all .2s; }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(124,92,255,.4); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn-ghost { background: transparent; color: #a1a1aa; padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255,255,255,.08); cursor: pointer; transition: all .2s; }
    .btn-ghost:hover { color: #e4e4e7; border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.05); }
    .file-card { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .waveform-container { position: relative; height: 60px; background: #000; border-radius: 6px; overflow: hidden; cursor: pointer; }
    canvas.waveform { width: 100%; height: 100%; display: block; }
    .region-overlay { position: absolute; top: 0; height: 100%; background: rgba(124,92,255,.3); pointer-events: none; }
    .slider-group { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
    .slider-group input[type="range"] { flex: 1; -webkit-appearance: none; height: 4px; background: #27272a; border-radius: 2px; outline: none; }
    .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #7c5cff; border-radius: 50%; cursor: pointer; }
    .log-console { background: #000; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 11px; max-height: 120px; overflow-y: auto; border: 1px solid rgba(255,255,255,.04); }
    .log-line { display: flex; gap: 8px; }
    .log-tag { font-weight: 700; width: 60px; flex-shrink: 0; }
    .log-tag.info { color: #60a5fa; }
    .log-tag.success { color: #4ade80; }
    .log-tag.error { color: #f87171; }
    .log-tag.process { color: #fbbf24; }
  </style>
</head>
<body class="min-h-screen p-4 flex items-start justify-center">

<div class="w-full max-w-5xl">

  <!-- HEADER -->
  <div class="flex items-center justify-between mb-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">🎚️ Editor Audio <span class="text-indigo-400">Potong & Sambung</span></h1>
      <p class="text-xs text-zinc-500">Upload file → potong bagian → gabung semua jadi satu</p>
    </div>
    <div id="statusBadge" class="text-xs bg-zinc-800 px-3 py-1 rounded-full text-zinc-400">⏳ Siap</div>
  </div>

  <!-- UPLOAD ZONE -->
  <div class="upload-zone mb-4" id="uploadZone">
    <input type="file" id="audioInput" accept="audio/*" multiple class="hidden">
    <div>
      <i class="fa-solid fa-cloud-arrow-up text-2xl text-zinc-600"></i>
      <p class="text-sm font-medium mt-1">Tarik & lepas, atau klik untuk upload (bisa banyak file)</p>
      <p class="text-[10px] text-zinc-600" id="fileInfo">Belum ada file</p>
    </div>
  </div>

  <!-- DAFTAR FILE + WAVEFORM -->
  <div id="fileList" class="space-y-2"></div>

  <!-- AKSI GLOBAL -->
  <div class="flex flex-wrap items-center gap-3 mt-4 p-4 glass rounded-xl">
    <button class="btn-primary" id="concatBtn"><i class="fa-solid fa-link"></i> Gabung Semua</button>
    <button class="btn-primary" id="cropBtn" disabled><i class="fa-solid fa-scissors"></i> Potong File Terpilih</button>
    <button class="btn-ghost" id="resetBtn"><i class="fa-solid fa-rotate"></i> Reset</button>
    <span class="text-xs text-zinc-500 ml-auto" id="progressText">Belum ada proses</span>
  </div>

  <!-- LOG -->
  <div class="mt-4 glass rounded-xl p-3">
    <div class="flex justify-between items-center mb-1.5">
      <span class="text-xs font-semibold text-zinc-500"><i class="fa-solid fa-terminal"></i> Log</span>
      <button class="text-[10px] text-zinc-600 hover:text-zinc-300" id="clearLog">Clear</button>
    </div>
    <div id="logConsole" class="log-console"></div>
  </div>

</div>

<script>
  // ============================================
  // SETUP
  // ============================================
  const { FFmpeg } = FFmpegWASM;
  const { toBlobURL, fetchFile } = FFmpegUtil;

  const $ = id => document.getElementById(id);
  const audioInput = $('audioInput');
  const uploadZone = $('uploadZone');
  const fileList = $('fileList');
  const fileInfo = $('fileInfo');
  const concatBtn = $('concatBtn');
  const cropBtn = $('cropBtn');
  const resetBtn = $('resetBtn');
  const progressText = $('progressText');
  const statusBadge = $('statusBadge');
  const logConsole = $('logConsole');
  const clearLog = $('clearLog');

  let ffmpeg = null;
  let loaded = false;
  let files = []; // array { id, file, name, size, audioBuffer, waveformData, start, end }

  let fileCounter = 0;
  let selectedFileId = null; // id file yang sedang dipilih untuk dipotong

  // ============================================
  // LOGGING
  // ============================================
  function log(tag, msg) {
    const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
    const row = document.createElement('div');
    row.className = 'log-line';
    const cls = tag.toLowerCase();
    row.innerHTML = `<span class="log-tag ${cls}">[${tag.toUpperCase()}]</span><span class="text-zinc-500">${time}</span><span class="text-zinc-300">${msg}</span>`;
    logConsole.appendChild(row);
    logConsole.scrollTop = logConsole.scrollHeight;
  }

  function updateStatus(msg, type = 'info') {
    statusBadge.textContent = msg;
    statusBadge.className = `text-xs px-3 py-1 rounded-full ${
      type === 'error' ? 'bg-red-900/50 text-red-300' :
      type === 'success' ? 'bg-emerald-900/50 text-emerald-300' :
      'bg-zinc-800 text-zinc-400'
    }`;
  }

  clearLog.addEventListener('click', () => { logConsole.innerHTML = ''; });

  // ============================================
  // BOOT FFMPEG
  // ============================================
  async function bootFFmpeg() {
    if (loaded) return;
    try {
      ffmpeg = new FFmpeg();
      log('info', 'Memuat FFmpeg engine...');
      updateStatus('Loading FFmpeg...', 'info');
      await ffmpeg.load({
        coreURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js', 'text/javascript'),
        wasmURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.wasm', 'application/wasm'),
        classWorkerURL: await toBlobURL('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js', 'text/javascript'),
      });
      loaded = true;
      ffmpeg.on('log', ({ message }) => { /* silent */ });
      ffmpeg.on('progress', ({ progress }) => {
        const p = Math.round(progress * 100);
        progressText.textContent = `Proses ${p}%`;
      });
      log('success', 'FFmpeg siap!');
      updateStatus('FFmpeg siap', 'success');
    } catch (e) {
      log('error', `Gagal load FFmpeg: ${e.message}`);
      updateStatus('Error load FFmpeg', 'error');
    }
  }
  bootFFmpeg();

  // ============================================
  // UPLOAD & DECODE AUDIO
  // ============================================
  uploadZone.addEventListener('click', () => audioInput.click());
  uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.style.borderColor = 'rgba(124,92,255,.6)'; });
  uploadZone.addEventListener('dragleave', () => { uploadZone.style.borderColor = ''; });
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.style.borderColor = '';
    if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  audioInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFiles(e.target.files);
    e.target.value = '';
  });

  function handleFiles(fileListObj) {
    const arr = Array.from(fileListObj);
    arr.forEach(file => {
      if (file.type.startsWith('audio/')) {
        processFile(file);
      } else {
        log('error', `File ${file.name} bukan audio.`);
      }
    });
    updateFileInfo();
    updateCropButton();
  }

  async function processFile(file) {
    try {
      const arrayBuffer = await file.arrayBuffer();
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
      const waveformData = getWaveformData(audioBuffer, 800); // 800 titik

      const id = ++fileCounter;
      files.push({
        id,
        file,
        name: file.name,
        size: file.size,
        audioBuffer,
        waveformData,
        start: 0,
        end: audioBuffer.duration,
        selected: false,
      });
      log('info', `✅ ${file.name} (${audioBuffer.duration.toFixed(1)} detik)`);
      renderFileList();
    } catch (e) {
      log('error', `Gagal decode ${file.name}: ${e.message}`);
    }
  }

  function getWaveformData(audioBuffer, points) {
    const data = audioBuffer.getChannelData(0);
    const step = Math.floor(data.length / points);
    const result = [];
    for (let i = 0; i < points; i++) {
      const start = i * step;
      let sum = 0;
      for (let j = 0; j < step; j++) {
        sum += Math.abs(data[start + j] || 0);
      }
      result.push(sum / step);
    }
    return result;
  }

  function updateFileInfo() {
    fileInfo.textContent = files.length ? `${files.length} file terupload` : 'Belum ada file';
  }

  // ============================================
  // RENDER FILE LIST + WAVEFORM
  // ============================================
  function renderFileList() {
    if (!files.length) {
      fileList.innerHTML = '<div class="text-center text-zinc-500 text-sm py-6">Belum ada file. Upload dulu!</div>';
      return;
    }

    let html = '';
    files.forEach((f, idx) => {
      const isSelected = (f.id === selectedFileId);
      html += `
        <div class="file-card ${isSelected ? 'border-indigo-400/50' : ''}" data-id="${f.id}">
          <div class="flex items-center justify-between gap-2 mb-1">
            <div class="flex items-center gap-2">
              <span class="text-xs font-medium text-zinc-300 truncate">${f.name}</span>
              <span class="text-[10px] text-zinc-500">${f.audioBuffer.duration.toFixed(1)}s</span>
            </div>
            <div class="flex gap-1">
              <button class="btn-ghost text-[10px] py-0.5 px-2 select-btn" data-id="${f.id}">Pilih</button>
              <button class="btn-ghost text-[10px] py-0.5 px-2 remove-btn" data-id="${f.id}"><i class="fa-solid fa-xmark"></i></button>
            </div>
          </div>
          <div class="waveform-container" data-id="${f.id}">
            <canvas class="waveform" data-id="${f.id}"></canvas>
            <div class="region-overlay" id="region-${f.id}" style="left:${(f.start/f.audioBuffer.duration)*100}%;width:${((f.end-f.start)/f.audioBuffer.duration)*100}%;"></div>
          </div>
          <div class="slider-group">
            <span class="text-[9px] text-zinc-500 w-10">Start</span>
            <input type="range" min="0" max="100" value="${(f.start/f.audioBuffer.duration)*100}" class="start-slider" data-id="${f.id}">
            <span class="text-[9px] text-zinc-500 w-10">End</span>
            <input type="range" min="0" max="100" value="${(f.end/f.audioBuffer.duration)*100}" class="end-slider" data-id="${f.id}">
            <span class="text-[9px] text-zinc-500 w-12" id="time-${f.id}">${f.start.toFixed(1)}s - ${f.end.toFixed(1)}s</span>
          </div>
        </div>
      `;
    });
    fileList.innerHTML = html;

    // Gambar waveform untuk setiap file
    files.forEach(f => {
      const canvas = document.querySelector(`canvas.waveform[data-id="${f.id}"]`);
      if (canvas) drawWaveform(canvas, f.waveformData);
    });

    // Event listener untuk tombol pilih
    document.querySelectorAll('.select-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.dataset.id);
        selectedFileId = id;
        renderFileList();
        updateCropButton();
      });
    });

    // Event listener untuk hapus
    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.dataset.id);
        removeFile(id);
      });
    });

    // Event listener slider
    document.querySelectorAll('.start-slider').forEach(slider => {
      slider.addEventListener('input', (e) => {
        const id = parseInt(slider.dataset.id);
        const file = files.find(f => f.id === id);
        if (!file) return;
        const pct = parseFloat(slider.value) / 100;
        file.start = Math.min(pct * file.audioBuffer.duration, file.end - 0.5);
        // Update end slider min
        const endSlider = document.querySelector(`.end-slider[data-id="${id}"]`);
        if (endSlider) endSlider.min = slider.value;
        updateRegionAndTime(id);
      });
    });

    document.querySelectorAll('.end-slider').forEach(slider => {
      slider.addEventListener('input', (e) => {
        const id = parseInt(slider.dataset.id);
        const file = files.find(f => f.id === id);
        if (!file) return;
        const pct = parseFloat(slider.value) / 100;
        file.end = Math.max(pct * file.audioBuffer.duration, file.start + 0.5);
        const startSlider = document.querySelector(`.start-slider[data-id="${id}"]`);
        if (startSlider) startSlider.max = slider.value;
        updateRegionAndTime(id);
      });
    });

    // Klik pada waveform untuk pilih file
    document.querySelectorAll('.waveform-container').forEach(container => {
      container.addEventListener('click', (e) => {
        const id = parseInt(container.dataset.id);
        selectedFileId = id;
        renderFileList();
        updateCropButton();
      });
    });
  }

  function drawWaveform(canvas, data) {
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width || 800;
    canvas.height = rect.height || 60;
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const step = Math.max(1, Math.floor(data.length / w));
    ctx.fillStyle = '#7c5cff';
    for (let i = 0; i < w; i++) {
      const idx = Math.min(i * step, data.length - 1);
      const val = Math.min(data[idx] || 0, 1);
      const barHeight = val * h * 0.8;
      const y = (h - barHeight) / 2;
      ctx.fillRect(i, y, 2, barHeight);
    }
  }

  function updateRegionAndTime(id) {
    const file = files.find(f => f.id === id);
    if (!file) return;
    const region = document.getElementById(`region-${id}`);
    if (region) {
      const dur = file.audioBuffer.duration;
      region.style.left = (file.start / dur * 100) + '%';
      region.style.width = ((file.end - file.start) / dur * 100) + '%';
    }
    const timeLabel = document.getElementById(`time-${id}`);
    if (timeLabel) {
      timeLabel.textContent = `${file.start.toFixed(1)}s - ${file.end.toFixed(1)}s`;
    }
  }

  function removeFile(id) {
    files = files.filter(f => f.id !== id);
    if (selectedFileId === id) selectedFileId = null;
    renderFileList();
    updateFileInfo();
    updateCropButton();
  }

  function updateCropButton() {
    const hasSelected = files.some(f => f.id === selectedFileId);
    cropBtn.disabled = !hasSelected || !loaded;
  }

  // ============================================
  // POTONG FILE
  // ============================================
  cropBtn.addEventListener('click', async () => {
    if (!loaded) { log('error', 'FFmpeg belum siap.'); return; }
    const file = files.find(f => f.id === selectedFileId);
    if (!file) return;
    const start = file.start;
    const end = file.end;
    if (end - start < 0.5) { log('error', 'Region terlalu pendek (min 0.5 detik)'); return; }

    cropBtn.disabled = true;
    progressText.textContent = 'Memotong...';
    log('process', `✂️ Potong ${file.name} dari ${start.toFixed(1)}s sampai ${end.toFixed(1)}s`);

    try {
      const ext = file.name.split('.').pop() || 'mp3';
      const inputName = `input.${ext}`;
      const outputName = `cropped.${ext}`;

      const fileData = new Uint8Array(await file.file.arrayBuffer());
      await ffmpeg.writeFile(inputName, fileData);

      await ffmpeg.exec([
        '-i', inputName,
        '-ss', start.toString(),
        '-to', end.toString(),
        '-c', 'copy',
        outputName
      ]);

      const data = await ffmpeg.readFile(outputName);
      if (!data || data.byteLength === 0) throw new Error('Hasil potong kosong.');

      const blob = new Blob([data.buffer], { type: file.file.type || 'audio/mpeg' });
      const url = URL.createObjectURL(blob);
      const newFile = new File([blob], `cropped_${file.name}`, { type: blob.type });

      // Tambahkan hasil potong sebagai file baru
      await processFile(newFile);

      // Bersihkan
      await ffmpeg.deleteFile(inputName).catch(() => {});
      await ffmpeg.deleteFile(outputName).catch(() => {});

      log('success', `✅ Potong selesai: ${newFile.name}`);
      progressText.textContent = 'Potong selesai';
    } catch (e) {
      log('error', `Gagal potong: ${e.message}`);
      progressText.textContent = 'Error';
    }
    cropBtn.disabled = false;
    updateCropButton();
  });

  // ============================================
  // GABUNG SEMUA FILE
  // ============================================
  concatBtn.addEventListener('click', async () => {
    if (!loaded) { log('error', 'FFmpeg belum siap.'); return; }
    if (files.length < 2) { log('error', 'Butuh minimal 2 file untuk digabung.'); return; }

    concatBtn.disabled = true;
    progressText.textContent = 'Menggabung...';
    log('process', `🔗 Gabung ${files.length} file`);

    try {
      // Tulis semua file ke WASM
      const inputNames = [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const ext = f.name.split('.').pop() || 'mp3';
        const name = `file_${i}.${ext}`;
        const data = new Uint8Array(await f.file.arrayBuffer());
        await ffmpeg.writeFile(name, data);
        inputNames.push(name);
      }

      // Buat file list untuk concat
      const listContent = inputNames.map(n => `file '${n}'`).join('\n');
      await ffmpeg.writeFile('list.txt', listContent);

      const outputName = 'merged.mp3';
      await ffmpeg.exec([
        '-f', 'concat',
        '-safe', '0',
        '-i', 'list.txt',
        '-c', 'copy',
        outputName
      ]);

      const data = await ffmpeg.readFile(outputName);
      if (!data || data.byteLength === 0) throw new Error('Hasil gabung kosong.');

      const blob = new Blob([data.buffer], { type: 'audio/mpeg' });
      const url = URL.createObjectURL(blob);
      const newFile = new File([blob], `merged_audio.mp3`, { type: 'audio/mpeg' });

      // Tambahkan hasil gabung sebagai file baru
      await processFile(newFile);

      // Bersihkan file WASM
      for (const name of inputNames) {
        await ffmpeg.deleteFile(name).catch(() => {});
      }
      await ffmpeg.deleteFile('list.txt').catch(() => {});
      await ffmpeg.deleteFile(outputName).catch(() => {});

      log('success', `✅ Gabung selesai! Total ${files.length} file menjadi satu.`);
      progressText.textContent = 'Gabung selesai';
    } catch (e) {
      log('error', `Gagal gabung: ${e.message}`);
      progressText.textContent = 'Error';
    }
    concatBtn.disabled = false;
  });

  // ============================================
  // RESET
  // ============================================
  resetBtn.addEventListener('click', () => {
    files = [];
    selectedFileId = null;
    renderFileList();
    updateFileInfo();
    updateCropButton();
    progressText.textContent = 'Reset';
    log('info', '🔄 Semua file direset');
  });

  // ============================================
  // INIT
  // ============================================
  log('info', '🎚️ Editor Audio siap! Upload file, atur region, potong atau gabung.');
  updateFileInfo();
  updateCropButton();

  // ============================================
  // FUNGSI BANTU UNTUK RESIZE WAVEFORM SAAT WINDOW RESIZE
  // ============================================
  window.addEventListener('resize', () => {
    // Redraw all waveforms
    files.forEach(f => {
      const canvas = document.querySelector(`canvas.waveform[data-id="${f.id}"]`);
      if (canvas) drawWaveform(canvas, f.waveformData);
    });
  });
</script>
</body>
</html>
